#xh::after{top:9px;left:0;height:2px;width:20px}

button{background:#232c38;color:var(--tx);border:1px solid #34414f;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}
button:hover:not(:disabled){border-color:var(--ac)}button.pri{background:var(--ac);color:#10141a;border-color:var(--ac);font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.card{background:#1d2530;border:1px solid #2a3442;border-radius:10px;padding:12px;cursor:pointer}.card.lock{opacity:.45;cursor:not-allowed}.card:hover:not(.lock){border-color:var(--ac)}
.card b{display:block;margin-bottom:4px}.card small{color:#8b98a8;display:block}
label{display:block;margin:8px 0;font-size:14px}input[type=range]{width:100%}
kbd{background:#232c38;border:1px solid #34414f;border-radius:4px;padding:1px 6px;font-size:12px}

function phBoxHit(P,world,x,y,z){const w=P.w/2;for(const b of world){const[x0,x1,y0,y1,z0,z1]=phBounds(b);
  if(x+w>x0+PEP&&x-w<x1-PEP&&y+P.h>y0+PEP&&y<y1-PEP&&z+w>z0+PEP&&z-w<z1-PEP)return true}return false}
function phClip(d,lo,hi,bl,bh){if(d>0&&hi<=bl+PEP){const t=bl-hi;if(t<d)d=t}else if(d<0&&lo>=bh-PEP){const t=bh-lo;if(t>d)d=t}return d}
// Swept AABB, vanilla order: Y, then X, then Z.
function phSweep(world,x,y,z,dx,dy,dz,P=PROFILE){const w=P.w/2,H=P.h;
 for(const b of world){const[x0,x1,y0,y1,z0,z1]=phBounds(b);if(x+w>x0+PEP&&x-w<x1-PEP&&z+w>z0+PEP&&z-w<z1-PEP)dy=phClip(dy,y,y+H,y0,y1)}y+=dy;
 for(const b of world){const[x0,x1,y0,y1,z0,z1]=phBounds(b);if(y+H>y0+PEP&&y<y1-PEP&&z+w>z0+PEP&&z-w<z1-PEP)dx=phClip(dx,x-w,x+w,x0,x1)}x+=dx;
 for(const b of world){const[x0,x1,y0,y1,z0,z1]=phBounds(b);if(x+w>x0+PEP&&x-w<x1-PEP&&y+H>y0+PEP&&y<y1-PEP)dz=phClip(dz,z-w,z+w,z0,z1)}z+=dz;
 return{x,y,z,dx,dy,dz}}
// Surface phUnder the player's CENTER (vanilla samples the block at posX, minY-1, posZ), not the whole box.
const phUnder=(world,x,y,z)=>world.find(b=>{const[x0,x1,,y1,z0,z1]=phBounds(b);return Math.abs(y1-y)<1e-4&&x>x0&&x<x1&&z>z0&&z<z1})||null;

// input: {f,b,l,r,jump,jumpPressed,sneak,sprintKey,yaw}. Mutates state `s`; returns events.
function phTick(s,inp,world,P=PROFILE){
 const ev={jumped:false,landed:false,landSpeed:0,bounced:false,fell:false};
 let fx=0,fz=0;if(inp.f)fz-=1;if(inp.b)fz+=1;if(inp.l)fx-=1;if(inp.r)fx+=1;
 const l=Math.hypot(fx,fz);if(l){fx/=l;fz/=l}
 const c=Math.cos(inp.yaw),sn=Math.sin(inp.yaw),wx=fx*c+fz*sn,wz=-fx*sn+fz*c,sneak=!!inp.sneak;
 if(!inp.f||sneak)s.sprint=false;if(inp.f&&!sneak&&inp.sprintKey)s.sprint=true;
 const Mt=sneak?P.sneakM:(s.sprint?P.sprintM:1),wasG=s.ground;
 if(inp.jumpPressed)s.jumpBuffer=Math.max(P.jumpBufferTicks,1); // 1 = "this phTick only" (vanilla)
 const jh=s.jumpBuffer>0||!!inp.jump;if(!inp.jump)s.jcd=0;if(s.jcd>0)s.jcd--;
 const slip=wasG&&s.on?(s.on.t==='ice'?P.ice:s.on.t==='slime'?P.slime:P.slip):P.slip;
 // 1) acceleration (+ jump)
 if(jh&&wasG&&s.jcd<=0){s.vy=P.jumpV;s.jcd=P.jumpCD;s.jumpBuffer=0;ev.jumped=true;
  if(s.sprint){s.vx-=Math.sin(inp.yaw)*P.boost;s.vz-=Math.cos(inp.yaw)*P.boost}}
 const a=wasG?P.gAcc*Mt*Math.pow(.6/slip,3):P.aAcc*Mt,im=l>1?1:.98;s.vx+=wx*a*im;s.vz+=wz*a*im;
 // 2) move: sneak edge guard, swept clipping, step-up
 let vx=s.vx,vy=s.vy,vz=s.vz,land=0;
 if(sneak&&wasG){const E=(x,z)=>!phBoxHit(P,world,s.x+x,s.y-P.sneakProbe,s.z+z),q=P.sneakStep,sh=v=>Math.abs(v)<q?0:v-Math.sign(v)*q;
  while(vx!==0&&E(vx,0))vx=sh(vx);while(vz!==0&&E(0,vz))vz=sh(vz);while(vx!==0&&vz!==0&&E(vx,vz)){vx=sh(vx);vz=sh(vz)}}
 const mx=vx,mz=vz;let r=phSweep(world,s.x,s.y,s.z,mx,vy,mz,P),stepped=false;
 if((r.dx!==mx||r.dz!==mz)&&(wasG||(P.stepWhileFalling&&vy<0&&r.dy!==vy))){
  const u=phSweep(world,s.x,s.y,s.z,0,P.stepH,0,P),m=phSweep(world,u.x,u.y,u.z,mx,0,mz,P),d=phSweep(world,m.x,m.y,m.z,0,-(u.y-s.y),0,P);
  if(m.dx*m.dx+m.dz*m.dz>r.dx*r.dx+r.dz*r.dz+1e-9){r={x:d.x,y:d.y,z:d.z,dx:m.dx,dy:vy,dz:m.dz};stepped=true}}
 s.x=r.x;s.y=r.y;s.z=r.z;
 if(!stepped){let hit=false;if(r.dx!==mx){s.vx=0;hit=true}if(r.dz!==mz){s.vz=0;hit=true}
  if(hit&&(P.sprintCancelAny||(r.dx!==mx&&Math.abs(mx)>.15)||(r.dz!==mz&&Math.abs(mz)>.15)))s.sprint=false}
 if(vy>0&&r.dy!==vy)s.vy=0;
 if(stepped||(vy<=0&&r.dy!==vy)){land=Math.min(vy,0);s.vy=0;s.ground=true;s.on=phUnder(world,s.x,s.y,s.z)}else{s.ground=false}
 // slime: vanilla negates the incoming vertical speed (no damping); sneaking disables it
 if(s.ground&&s.on&&s.on.t==='slime'&&!sneak&&!wasG&&land<-P.slimeMinImpact){s.vy=-land;s.ground=false;ev.bounced=true}
 if(!wasG&&s.ground&&land<-P.landEventSpeed){ev.landed=true;ev.landSpeed=land}
 // 3) drag + gravity
 const dr=(wasG?slip:1)*P.adrag;s.vx*=dr;s.vz*=dr;s.vy=Math.max((s.vy-P.grav)*P.vdrag,P.term);
 // 4) anti-jitter
 if(Math.abs(s.vx)<P.thr)s.vx=0;if(Math.abs(s.vz)<P.thr)s.vz=0;
 if(s.jumpBuffer>0)s.jumpBuffer--;
 if(s.y<P.voidY)ev.fell=true;
 return ev}

const PS=phState();
function tick(){const p=G.pos,v=G.v;G.pp={x:p.x,y:p.y,z:p.z};
 Object.assign(PS,{x:p.x,y:p.y,z:p.z,vx:v.x,vy:v.y,vz:v.z,ground:G.ground,on:G.on,sprint:G.sprint,jcd:G.jcd,jumpBuffer:G.jumpBuffer});
 const P=Object.assign({},PROFILE,{jumpBufferTicks:S.jbuf?3:0,sprintCancelAny:!S.slide,voidY:CFG.voidY});
 const ev=phTick(PS,{f:!!keys[B.f],b:!!keys[B.b],l:!!keys[B.l],r:!!keys[B.r],jump:!!keys[B.jump],jumpPressed:!!G.jp,sneak:!!keys[B.sneak],sprintKey:!!keys[B.sprint],yaw:G.yaw},plats,P);G.jp=false;
 p.x=PS.x;p.y=PS.y;p.z=PS.z;v.x=PS.vx;v.y=PS.vy;v.z=PS.vz;G.ground=PS.ground;G.on=PS.on;G.sprint=PS.sprint;G.jcd=PS.jcd;G.jumpBuffer=PS.jumpBuffer;
 if(ev.jumped)sfx('jump');if(ev.landed){sfx('land');burst(p.x,p.y,p.z)}
 // timer starts on real displacement (leaving the spawn point), not on a key press
 if(!G.run&&!G.done&&(Math.hypot(p.x-G.s0.x,p.z-G.s0.z)>.02||p.y>G.s0.y+.01))G.run=true;
 if(G.ground&&G.on){const i=plats.indexOf(G.on);
  if(G.on.t==='cp'&&G.cp<i){G.cp=i;G.rp=G.on;G.splits.push(G.t);toast('Checkpoint');sfx('cp');burst(p.x,p.y,p.z)}
  if(G.on.t==='finish'&&!G.done)finish()}
 if(ev.fell&&!G.done){respawn(true);toast('Fell!');sfx('fall')}
 if(G.run&&!G.done)G.t+=TICK}

function progress(p){const a=plats[0],b=plats[plats.length-1],dx=b.x-a.x,dz=b.z-a.z;return Math.max(0,Math.min(100,Math.round(((p.x-a.x)*dx+(p.z-a.z)*dz)/(dx*dx+dz*dz)*100)))}
function finish(){sfx('win');G.done=true;G.run=false;const c=G.course,t=G.t,b=PR.best[c.id];const pb=b===undefined||t<b;if(pb)PR.best[c.id]=t;PR.done[c.id]=true;save();
 const medal=t<=c.medals[2]?'Gold':t<=c.medals[1]?'Silver':t<=c.medals[0]?'Bronze':'None';
 if(document.pointerLockElement)document.exitPointerLock();G.paused=true;
 const nxt=G.idx+1<COURSES.length;
 ov.style.display='flex';ov.innerHTML=`<div class="pn"><h2>Course Complete</h2><div class="sub">${c.name}</div>
 <p style="font-size:32px;margin:0;color:var(--ac)">${t.toFixed(2)}s ${pb?'<small style="color:var(--cy)">NEW PERSONAL BEST</small>':''}</p>
 <p>Falls: ${G.falls} · Checkpoints: ${G.cp?G.splits.length:0} · Medal: ${medal}</p>
 <button class="pri" id="b1">Retry</button>${nxt?'<button id="b2">Next course</button>':''}<button id="b3">Course select</button></div>`;
 b1.onclick=()=>start(G.idx);if(nxt)b2.onclick=()=>start(G.idx+1);b3.onclick=menu}
// ---------- UI ----------
const fmt=t=>t===undefined?'—':t.toFixed(2)+'s';
const medalOf=(c,t)=>t===undefined?'':t<=c.medals[2]?'🥇 Gold':t<=c.medals[1]?'🥈 Silver':t<=c.medals[0]?'🥉 Bronze':'Finished';
function menu(){G.paused=true;hud.style.display='none';if(document.pointerLockElement)document.exitPointerLock();ov.style.display='flex';
 ov.innerHTML=`<div class="pn"><h1>PARKOUR LAB</h1><div class="sub">Block-based parkour training · local personal bests</div><div class="cards">`+
 COURSES.map((c,i)=>{const lk=i>0&&!PR.done[COURSES[i-1].id]&&!PR.done[c.id];return `<div class="card ${lk?'lock':''}" data-i="${i}"><b>${c.name}</b><small>${c.diff} · ~${c.est}</small><small>Best: ${fmt(PR.best[c.id])} ${medalOf(c,PR.best[c.id])}</small><small>${lk?'🔒 Finish previous course':PR.done[c.id]?'✔ Completed':'Unlocked'}</small></div>`}).join('')+
 `</div><button id="st">Statistics</button><button id="se">Settings</button><button id="co">Controls</button></div>`;
 ov.querySelectorAll('.card:not(.lock)').forEach(e=>e.onclick=()=>start(+e.dataset.i));st.onclick=stats;se.onclick=()=>settings(menu);co.onclick=()=>controlsPanel(menu)}
function stats(){const n=Object.keys(PR.done).length;ov.innerHTML=`<div class="pn"><h2>Statistics</h2><p>Courses completed: ${n}/${COURSES.length}<br>Total attempts: ${PR.attempts}<br>Total falls: ${PR.falls}</p><button class="pri" id="bk">Back</button><button id="rs">Reset progress</button></div>`;bk.onclick=menu;rs.onclick=()=>{if(confirm('Erase all progress?')){PR={best:{},done:{},falls:0,attempts:0};save();menu()}}}
const BL=[['f','Forward'],['b','Back'],['l','Left'],['r','Right'],['jump','Jump'],['sneak','Sneak'],['sprint','Sprint'],['view','Camera view'],['resp','Respawn']];
let ctrlBack=menu;
function controlsPanel(b){if(b)ctrlBack=b;ov.style.display='flex';
 ov.innerHTML=`<div class="pn"><h2>Controls</h2><div class="sub">Click an action, then press its new key (Esc cancels). Sneak slows you and stops you falling off edges. Sprint with the Sprint key or double-tap Forward; it stops when you let go of Forward, sneak, or hit a wall. Ctrl+W closes the browser tab, so double-tap W is safer.</div>`+BL.map(([k,n])=>`<label style="display:flex;justify-content:space-between;align-items:center">${n}<button data-k="${k}" style="min-width:140px">${bindCap===k?'Press a key\u2026':kn(B[k])}</button></label>`).join('')+`<button class="pri" id="bk">Back</button><button id="rs">Reset defaults</button></div>`;
 ov.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{bindCap=e.dataset.k;controlsPanel()});bk.onclick=()=>{bindCap=null;ctrlBack()};rs.onclick=()=>{B={...BD};L.set('pl_keys',B);controlsPanel()}}
function settings(back){const row=(k,l,mn,mx,st)=>`<label>${l}: <b id="v_${k}">${S[k]}</b><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${S[k]}"></label>`;
 ov.style.display='flex';ov.innerHTML=`<div class="pn"><h2>Settings</h2>${row('sens','Mouse sensitivity',.2,3,.1)}${row('fov','Field of view',60,110,1)}${row('vol','Sound volume',0,1,.1)}<label><input type="checkbox" id="jb" ${S.jbuf?'checked':''}> Jump buffer assist (not vanilla)</label><label><input type="checkbox" id="sl" ${S.slide?'checked':''}> Keep sprint when scraping walls (not vanilla)</label><label><input type="checkbox" id="tp" ${S.tp?'checked':''}> Default to third-person camera</label><label><input type="checkbox" id="xh2" ${S.xh?'checked':''}> Show crosshair</label><label><input type="checkbox" id="fk" ${S.fovk?'checked':''}> Sprint FOV effect</label><button id="kb">Key bindings</button><button class="pri" id="bk">Back</button></div>`;
 ov.querySelectorAll('input[type=range]').forEach(e=>e.oninput=()=>{S[e.dataset.k]=+e.value;document.getElementById('v_'+e.dataset.k).textContent=e.value;save()});jb.onchange=()=>{S.jbuf=jb.checked;save()};sl.onchange=()=>{S.slide=sl.checked;save()};kb.onclick=()=>controlsPanel(()=>settings(back));tp.onchange=()=>{S.tp=tp.checked;save()};xh2.onchange=()=>{S.xh=xh2.checked;save()};fk.onchange=()=>{S.fovk=fk.checked;save()};bk.onclick=back}
function pause(){if(!G.started||G.done)return;G.paused=true;ov.style.display='flex';
 ov.innerHTML=`<div class="pn"><h2>Paused</h2><button class="pri" id="a">Resume</button><button id="b">Return to checkpoint</button><button id="c">Restart course</button><button id="d">Settings</button><button id="e">Exit to menu</button></div>`;
 a.onclick=resume;b.onclick=()=>{respawn(false);resume()};c.onclick=()=>start(G.idx);d.onclick=()=>settings(pause);e.onclick=menu}
function resume(){ov.style.display='none';G.paused=false;R.domElement.requestPointerLock()}
// ---------- Input ----------
let tpv=S.tp;
addEventListener('keydown',e=>{if(bindCap){e.preventDefault();if(e.code!=='Escape'){B[bindCap]=e.code;L.set('pl_keys',B)}bindCap=null;controlsPanel();return}keys[e.code]=true;if(e.code===B.f&&!e.repeat){const n=performance.now();if(n-(G.tap||0)<300&&!keys[B.sneak])G.sprint=true;G.tap=n}if(G.paused)return;
 if(e.code===B.jump){G.jp=true;e.preventDefault()}
 if(e.code===B.view)tpv=!tpv;if(e.code===B.resp){respawn(false);toast('Respawn')}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('mousemove',e=>{if(document.pointerLockElement!==R.domElement||G.paused)return;const k=.0022*S.sens;G.yaw-=e.movementX*k;G.pitch=Math.max(-1.5,Math.min(1.5,G.pitch-e.movementY*k))});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&!G.paused&&G.started&&!G.done)pause()});
function resize(){R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
// ---------- Loop ----------
let last=performance.now(),acc=0,bobT=0;
function frame(now){requestAnimationFrame(frame);let d=Math.min((now-last)/1000,.5);last=now;
 if(!G.paused&&G.course){acc+=d;let n=0;while(acc>=TICK&&n++<10){tick();acc-=TICK}if(acc>=TICK)acc=0}
 const al=!G.paused&&G.course?acc/TICK:1,q=G.pp||G.pos,p={x:q.x+(G.pos.x-q.x)*al,y:q.y+(G.pos.y-q.y)*al,z:q.z+(G.pos.z-q.z)*al};player.position.set(p.x,p.y+.9,p.z);player.rotation.y=G.yaw;player.visible=tpv;
 const tf=S.fov+(S.fovk&&!G.paused&&G.sprint?6:0);if(Math.abs(cam.fov-tf)>.01){cam.fov+=(tf-cam.fov)*Math.min(1,d*8);cam.updateProjectionMatrix()}
 document.getElementById('xh').style.display=(G.course&&!G.paused&&S.xh)?'block':'none';
 G.eye=G.eye||1.62;G.eye+=((keys[B.sneak]&&!G.paused?1.27:1.62)-G.eye)*Math.min(1,d*14);
 const dir=new THREE.Vector3(-Math.sin(G.yaw)*Math.cos(G.pitch),Math.sin(G.pitch),-Math.cos(G.yaw)*Math.cos(G.pitch));
 if(tpv){const tg=new THREE.Vector3(p.x,p.y+G.eye,p.z).addScaledVector(dir,-5);G.camP.lerp(tg,Math.min(1,d*14));cam.position.copy(G.camP);cam.lookAt(p.x,p.y+1.4,p.z)}
 else{G.camP.set(p.x,p.y+G.eye,p.z);cam.position.copy(G.camP);cam.lookAt(G.camP.clone().add(dir))}
 {const hs=G.ground?Math.hypot(G.v.x,G.v.z)*20:0,k=Math.min(hs/5,1),spr=!!G.sprint,air=!G.ground;bobT+=d*hs*1.6;
  arms.forEach((a,i)=>{const ph=i*Math.PI;a.visible=!tpv&&!G.paused&&!!G.course;a.position.y=-.38+Math.sin(bobT*2+ph)*.025*k+(air?.04:0);a.position.z=-.55+Math.cos(bobT+ph)*.03*k-(spr?.05:0);a.rotation.x=.15+(spr?.35:0)-(air?.25:0)+Math.sin(bobT+ph)*.12*k})}
 sun.position.set(p.x+20,p.y+40,p.z+10);sun.target.position.set(p.x,p.y,p.z);
 if(G.course){document.getElementById('timer').textContent=G.t.toFixed(2);const c=G.course,b=PR.best[c.id];
  document.getElementById('info').innerHTML=`${c.name}<br>Falls: ${G.falls}`;
  document.getElementById('right').innerHTML=`Checkpoint: ${G.splits.length}/${plats.filter(q=>q.t==='cp').length}<br>PB: ${fmt(b)}<br>Speed: ${(Math.hypot(G.v.x,G.v.z)*20).toFixed(1)} b/s${G.sprint?' (sprinting)':keys[B.sneak]?' (sneaking)':''}<br>Progress: ${progress(p)}%`}
 PT.forEach(m=>{if(m.life>0){m.life-=d;m.vel.y-=9*d;m.position.addScaledVector(m.vel,d);m.scale.setScalar(Math.max(m.life*2,.01));if(m.life<=0)m.visible=false}});R.render(scene,cam)}
load(COURSES[0]);G.camP.set(0,3,6);menu();requestAnimationFrame(frame);
})();
</script></body></html>
